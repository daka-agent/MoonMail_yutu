35%;transform:translateX(-50%)}.chat-container{position:fixed;right:0;left:0;bottom:0;top:auto;transform:none;width:100%;height:55vh;max-height:none;border-radius:20px 20px 0 0;border-bottom:none;box-shadow:0 -5px 30px rgba(0,0,0,0.4)}.chat-messages{padding:12px}.message{max-width:85%;font-size:15px}.chat-input-area{padding:10px 12px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}.quick-actions{gap:6px}.quick-btn{padding:7px 12px;font-size:12px}}@media (max-width:480px){.moon{width:55px;height:55px}.post-office{width:180px;bottom:44%}.yutu-character{width:110px;left:calc(50% + 55px);bottom:38%}.chat-container{height:58vh}.chat-header{padding:12px 16px}.chat-title{font-size:15px}.message{font-size:14px;line-height:1.65}.quick-btn{padding:6px 10px;font-size:11px}}@media (max-height:500px) and (orientation:landscape){.post-office{width:160px;bottom:25%;left:10%;transform:none}.yutu-character{width:100px;left:calc(10% + 120px);bottom:22%;transform:none}.chat-container{width:300px;height:85vh;right:3%;left:auto;bottom:auto;top:50%;transform:translateY(-50%);border-radius:16px}}.meteor{position:absolute;width:2px;height:2px;background:white;border-radius:50%;box-shadow:0 0 6px 2px rgba(255,255,255,0.5);animation:meteorFall linear forwards;z-index:1}.meteor::after{content:'';position:absolute;top:50%;right:0;width:80px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0.5),transparent);transform:translateY(-50%)}@keyframes meteorFall{0%{transform:translateX(0) translateY(0) rotate(-45deg);opacity:1}100%{transform:translateX(-200px) translateY(200px) rotate(-45deg);opacity:0}}.moon-cloud{position:fixed;background:rgba(255,255,255,0.03);border-radius:50%;filter:blur(20px);z-index:1;animation:cloudDrift 60s linear infinite}@keyframes cloudDrift{0%{transform:translateX(0)}100%{transform:translateX(-100vw)}}.osmanthus{position:fixed;bottom:12%;left:calc(15% + 220px);width:30px;height:60px;z-index:2}.osmanthus-trunk{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:4px;height:30px;background:#5c4a3a;border-radius:2px}.osmanthus-leaves{position:absolute;top:0;left:50%;transform:translateX(-50%);width:30px;height:35px;background:radial-gradient(ellipse at center,#3d5c3a,#2a4a28);border-radius:50% 50% 40% 40%}.osmanthus-flower{position:absolute;width:3px;height:3px;background:#ffe4a0;border-radius:50%;box-shadow:0 0 4px #ffe4a0;animation:flowerGlow 3s ease-in-out infinite}@keyframes flowerGlow{0%,100%{opacity:0.6}50%{opacity:1}}.yutu.yawn .yutu-head{animation:yawn 2s ease-in-out}@keyframes yawn{0%,100%{transform:translateX(-50%) scaleY(1)}40%,60%{transform:translateX(-50%) scaleY(1.1)}}.letter-glow{position:fixed;pointer-events:none;z-index:50;width:100px;height:100px;background:radial-gradient(circle,rgba(255,228,160,0.6),transparent);border-radius:50%;animation:letterFly 3s ease-out forwards}@keyframes letterFly{0%{opacity:0;transform:scale(0.5) translateY(0)}20%{opacity:1}100%{opacity:0;transform:scale(1.5) translateY(-300px)}}.moon.new-moon{background:radial-gradient(circle at 30% 30%,#2a2f4a,#1a1f35);box-shadow:0 0 30px rgba(100,100,150,0.2),inset -10px -10px 30px rgba(0,0,0,0.3)}.moon.crescent{background:linear-gradient(90deg,transparent 60%,var(--moon-yellow) 60%);border-radius:50%;box-shadow:10px 0 40px rgba(255,245,214,0.3),inset -10px -10px 30px rgba(0,0,0,0.1)}.moon.half-moon{background:linear-gradient(90deg,transparent 50%,var(--moon-yellow) 50%);box-shadow:0 0 50px rgba(255,245,214,0.3),inset -10px -10px 30px rgba(0,0,0,0.1)}.moon.gibbous{background:linear-gradient(90deg,transparent 20%,var(--moon-yellow) 20%);box-shadow:0 0 55px rgba(255,245,214,0.35),inset -10px -10px 30px rgba(0,0,0,0.1)}.moon.full-moon{background:radial-gradient(circle at 30% 30%,var(--moon-glow),var(--moon-yellow));box-shadow:0 0 60px rgba(255,245,214,0.4),0 0 120px rgba(255,245,214,0.2),inset -10px -10px 30px rgba(0,0,0,0.1)}.earth-view{position:fixed;bottom:8%;right:8%;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#5b9bd5,#2e5a8a);box-shadow:0 0 20px rgba(91,155,213,0.3),inset -5px -5px 15px rgba(0,0,0,0.2);z-index:1;opacity:0.8;animation:earthSpin 30s linear infinite}@keyframes earthSpin{0%{background-position:0 0}100%{background-position:100px 0}}</style>
</head>
<body>
  <!-- 星空背景 -->
  <div class="starfield" id="starfield"></div>

  <!-- 月亮 -->
  <div class="moon" id="moon">
    <div class="moon-craters">
      <div class="crater c1"></div>
      <div class="crater c2"></div>
      <div class="crater c3"></div>
      <div class="crater c4"></div>
    </div>
  </div>

  <!-- 月宫邮局（原版SVG） -->
  <div class="post-office" id="postOffice">
    <svg class="po-silhouette" viewBox="0 0 360 250" aria-hidden="true">
      <!-- 月盘（殿在月上） -->
      <circle cx="180" cy="132" r="104" fill="#263c61"></circle>
      <circle cx="140" cy="96" r="14" fill="#1e3151" opacity=".9"></circle>
      <circle cx="238" cy="160" r="10" fill="#1e3151" opacity=".8"></circle>
      <circle cx="252" cy="84" r="6" fill="#1e3151" opacity=".7"></circle>
      <circle cx="180" cy="132" r="104" fill="none" stroke="#f0c469" stroke-opacity=".12" stroke-width="2"></circle>
      <!-- 月面台基 -->
      <ellipse cx="180" cy="216" rx="128" ry="16" fill="#1a2c49"></ellipse>
      <ellipse cx="96" cy="218" rx="22" ry="5" fill="#16283f"></ellipse>
      <ellipse cx="272" cy="220" rx="18" ry="4" fill="#16283f"></ellipse>
      <!-- 宝顶 -->
      <circle cx="180" cy="52" r="4.5" fill="#0e1c30"></circle>
      <!-- 顶檐（飞檐上挑） -->
      <path d="M126 90 Q180 54 234 90 Q180 72 126 90 Z" fill="#0e1c30"></path>
      <!-- 上层殿身 -->
      <rect x="148" y="86" width="64" height="22" fill="#0c1728"></rect>
      <rect x="170" y="92" width="20" height="11" rx="2" fill="#f0c469" opacity=".42" class="window-glow"></rect>
      <!-- 腰檐 -->
      <path d="M106 118 Q180 80 254 118 Q180 98 106 118 Z" fill="#1a2c49"></path>
      <!-- 下层殿身 -->
      <rect x="128" y="114" width="104" height="30" fill="#0d1a2c"></rect>
      <!-- 匾额：月宫邮局 -->
      <rect x="152" y="120" width="56" height="18" rx="2" fill="#0a1424" stroke="#c9a25c" stroke-width="1.4"></rect>
      <text x="180" y="133.5" font-size="11" fill="#f0c469" font-family="KaiTi,STKaiti,serif" text-anchor="middle" letter-spacing="1">月宫邮局</text>
      <!-- 侧窗（暖光） -->
      <rect x="135" y="124" width="11" height="14" rx="2" fill="#f0c469" opacity=".38" class="window-glow"></rect>
      <rect x="214" y="124" width="11" height="14" rx="2" fill="#f0c469" opacity=".26" class="window-glow"></rect>
      <!-- 殿基 -->
      <rect x="120" y="144" width="120" height="8" rx="2" fill="#0f2136"></rect>
      <!-- 邮筒（月宫邮局的收信口） -->
      <rect x="258" y="130" width="24" height="36" rx="4" fill="#0e1c30" stroke="#f0c469" stroke-opacity=".32"></rect>
      <rect x="263" y="136" width="14" height="4" rx="2" fill="#f0c469" opacity=".6"></rect>
      <circle cx="270" cy="150" r="2" fill="#f0c469" opacity=".5"></circle>
      <!-- 攀上月宫的信 -->
      <g opacity=".8">
        <rect x="82" y="150" width="12" height="8" rx="1.5" fill="#f0c469" opacity=".55" transform="rotate(-14 88 154)"></rect>
        <rect x="292" y="112" width="11" height="7" rx="1.5" fill="#f0c469" opacity=".4" transform="rotate(12 297 115)"></rect>
      </g>
    </svg>
  </div>

  <!-- 装饰元素：飘动的信件、云朵、桂花 -->
  <div class="scene-decorations" id="sceneDecorations">
    <!-- 云朵 -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <!-- 飘动的信件（从邮局飘向聊天框） -->
    <div class="floating-letter letter-1">
      <svg viewBox="0 0 40 28" width="32" height="22">
        <rect x="2" y="4" width="36" height="22" rx="2" fill="#f0c469" opacity="0.75"/>
        <path d="M2 6 L20 18 L38 6" stroke="#c9a25c" stroke-width="1.5" fill="none" opacity="0.6"/>
      </svg>
    </div>
    <div class="floating-letter letter-2">
      <svg viewBox="0 0 40 28" width="26" height="18">
        <rect x="2" y="4" width="36" height="22" rx="2" fill="#f6e7c8" opacity="0.6"/>
        <path d="M2 6 L20 18 L38 6" stroke="#d4b88a" stroke-width="1.5" fill="none" opacity="0.5"/>
      </svg>
    </div>
    <div class="floating-letter letter-3">
      <svg viewBox="0 0 40 28" width="20" height="14">
        <rect x="2" y="4" width="36" height="22" rx="2" fill="#f0c469" opacity="0.45"/>
        <path d="M2 6 L20 18 L38 6" stroke="#c9a25c" stroke-width="1.5" fill="none" opacity="0.4"/>
      </svg>
    </div>

    <!-- 飘落的桂花 -->
    <div class="osmanthus-petal petal-1">✦</div>
    <div class="osmanthus-petal petal-2">✦</div>
    <div class="osmanthus-petal petal-3">✦</div>
    <div class="osmanthus-petal petal-4">✦</div>
    <div class="osmanthus-petal petal-5">✦</div>
    <div class="osmanthus-petal petal-6">✦</div>
  </div>

  <!-- 玉兔（原版SVG + 情绪动画） -->
  <div class="yutu-character" id="yutu">
    <svg class="yutu-svg" viewBox="0 0 560 440" role="img" aria-label="值夜班的玉兔">
      <!-- 影子 -->
      <ellipse class="yutu-shadow-ellipse" cx="300" cy="404" rx="150" ry="12" fill="#050a12" opacity=".5"></ellipse>

      <!-- 左耳朵 -->
      <g class="yutu-ear left-ear">
        <ellipse cx="228" cy="96" rx="15" ry="64" fill="#f4eee0" transform="rotate(-16 228 96)"></ellipse>
        <ellipse cx="228" cy="100" rx="6" ry="42" fill="#e8c4b6" transform="rotate(-16 228 100)" class="ear-inner"></ellipse>
      </g>

      <!-- 右耳朵 -->
      <g class="yutu-ear right-ear">
        <ellipse cx="272" cy="86" rx="15" ry="66" fill="#f4eee0" transform="rotate(7 272 86)"></ellipse>
        <ellipse cx="272" cy="92" rx="6" ry="44" fill="#e8c4b6" transform="rotate(7 272 92)" class="ear-inner"></ellipse>
      </g>

      <!-- 头 -->
      <ellipse class="yutu-head-shape" cx="256" cy="170" rx="60" ry="53" fill="#f4eee0"></ellipse>

      <!-- 身体 -->
      <path d="M148 402 C128 342 138 268 182 234 C220 204 268 220 288 262 C306 300 304 354 290 402 Z" fill="#f4eee0"></path>

      <!-- 尾巴（毛球） -->
      <circle cx="150" cy="356" r="22" fill="#fbf7ec"></circle>

      <!-- 后腿/脚 -->
      <ellipse cx="270" cy="396" rx="34" ry="13" fill="#e9e0cc"></ellipse>

      <!-- 手臂 -->
      <path class="yutu-arm" d="M266 274 Q294 258 306 264" stroke="#f4eee0" stroke-width="19" stroke-linecap="round" fill="none"></path>

      <!-- 单片眼镜 -->
      <g class="yutu-glass">
        <path d="M298 163 L318 157" stroke="#26313f" stroke-width="4" stroke-linecap="round"></path>
        <circle cx="285" cy="167" r="13.5" fill="#f4eee0" stroke="#26313f" stroke-width="4.5"></circle>
        <circle class="yutu-eye right-eye" cx="286.5" cy="168" r="5" fill="#1a2430"></circle>
        <circle cx="288.5" cy="165.5" r="1.8" fill="#f4eee0"></circle>
      </g>

      <!-- 左眼（没有眼镜） -->
      <ellipse class="yutu-eye left-eye" cx="244" cy="168" rx="5" ry="5.5" fill="#1a2430"></ellipse>

      <!-- 腮红 -->
      <ellipse class="yutu-blush left-blush" cx="226" cy="188" rx="10" ry="6" fill="#f0b8a8" opacity="0"></ellipse>
      <ellipse class="yutu-blush right-blush" cx="308" cy="188" rx="10" ry="6" fill="#f0b8a8" opacity="0"></ellipse>

      <!-- 鼻子 -->
      <ellipse class="yutu-nose" cx="304" cy="186" rx="4.5" ry="3.5" fill="#e0b3a4"></ellipse>

      <!-- 嘴巴 -->
      <ellipse class="yutu-mouth" cx="300" cy="198" rx="5.5" ry="3.2" fill="#c9938a" style="transform-origin:300px 198px"></ellipse>

      <!-- 药臼 -->
      <path d="M236 340 L364 340 Q356 400 300 400 Q244 400 236 340 Z" fill="#2f6b52"></path>
      <path d="M232 336 L368 336 L368 344 L232 344 Z" fill="#b9924a"></path>

      <!-- 药杵（会动） -->
      <g class="yutu-pestle">
        <rect x="297" y="228" width="15" height="112" rx="7.5" fill="#c9a25c"></rect>
        <circle cx="304.5" cy="230" r="15" fill="#d9b571"></circle>
      </g>

      <!-- 药臼里的光 -->
      <circle cx="304" cy="322" r="26" fill="#f6e7c8" opacity=".28" class="mortar-glow"></circle>
    </svg>
  </div>

  <!-- 聊天区域 -->
  <div class="chat-container" id="chatContainer">
    <div class="chat-header">
      <span class="chat-title">月亮邮局</span>
      <button class="settings-btn" id="settingsBtn" title="设置">⚙</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <!-- 消息会动态插入这里 -->
    </div>
    <div class="chat-input-area">
      <div class="input-wrapper">
        <input type="text" id="chatInput" placeholder="说点什么吧……" maxlength="500">
        <button id="sendBtn" class="send-btn">发送</button>
      </div>
      <div class="quick-actions">
        <button class="quick-btn" data-action="letter">写一封信</button>
        <button class="quick-btn" data-action="moon">看看月亮</button>
        <button class="quick-btn" data-action="mooncake">喂月饼</button>
        <button class="quick-btn" data-action="tea">桂花茶</button>
        <button class="quick-btn" data-action="story">讲个故事</button>
      </div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-content">
      <h3>设置</h3>

      <div class="setting-group">
        <label>AI 模式</label>
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="api">API Key 模式</button>
          <button class="mode-btn" data-mode="webllm">本地推理（WebLLM）</button>
        </div>
      </div>

      <div class="setting-group" id="apiSettings">
        <label>API 服务商</label>
        <select id="apiProvider">
          <option value="deepseek">DeepSeek</option>
          <option value="qwen">通义千问（阿里云）</option>
          <option value="moonshot">月之暗面（Kimi）</option>
          <option value="openai">OpenAI 兼容接口</option>
        </select>

        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="输入你的 API Key">
        <p class="hint">Key 只存在你的浏览器本地，不会上传到任何服务器。</p>

        <label>API 地址（可选）</label>
        <input type="text" id="apiBaseUrl" placeholder="自定义 API 地址">
      </div>

      <div class="setting-group" id="webllmSettings" style="display:none;">
        <label>本地模型</label>
        <select id="webllmModel">
          <option value="Qwen2-1.5B-Instruct">Qwen2-1.5B-Instruct</option>
        </select>
        <p class="hint">首次使用需要下载模型（约 1GB），请在 WiFi 环境下下载。下载完成后可以离线使用。</p>
        <button class="download-btn" id="downloadModelBtn">下载模型</button>
        <div class="download-progress" id="downloadProgress">
          <div class="progress-bar"></div>
          <span class="progress-text">准备中...</span>
        </div>
      </div>

      <div class="setting-group">
        <label>音效</label>
        <div class="toggle-row">
          <span class="toggle-label">开启交互音效</span>
          <label class="toggle-switch">
            <input type="checkbox" id="soundToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <p class="hint">默认关闭。开启后会有轻微的发送、收信等交互音效，没有背景音乐。</p>
      </div>

      <div class="setting-group">
        <button class="save-btn" id="saveSettingsBtn">保存设置</button>
        <button class="close-btn" id="closeSettingsBtn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 信件弹窗 -->
  <div class="letter-modal" id="letterModal">
    <div class="letter-paper">
      <h3>写一封信</h3>
      <p class="letter-hint">写给你想念的人。玉兔会替你送到月亮上。</p>
      <textarea id="letterContent" placeholder="写下你想说的话……" maxlength="1000"></textarea>
      <div class="letter-actions">
        <button class="send-letter-btn" id="sendLetterBtn">寄出去</button>
        <button class="cancel-letter-btn" id="cancelLetterBtn">算了</button>
      </div>
    </div>
